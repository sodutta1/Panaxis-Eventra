# Local development stack: mysql + backend + frontend
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: panaxis_eventra
      MYSQL_USER: eventra_app
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in deploy/.env}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: ${APP_KEY:?set APP_KEY in deploy/.env}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: panaxis_eventra
      DB_USERNAME: eventra_app
      DB_PASSWORD: ${DB_PASSWORD}
      FRONTEND_URL: http://localhost:5173
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8000:9000"

  frontend:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
      args:
        VITE_API_URL: http://localhost:8000/api/v1
        VITE_DEMO_MODE: "true"
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  mysql-data:
