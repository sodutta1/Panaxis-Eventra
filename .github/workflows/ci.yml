name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: eventflow_test
          MYSQL_USER: eventra_app
          MYSQL_PASSWORD: ci-test-password
          MYSQL_RANDOM_ROOT_PASSWORD: "yes"
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, dom, fileinfo, mysql, pdo, pdo_mysql, gd, zip, intl
          coverage: none
      - name: Install dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Run migrations and seed
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: eventflow_test
          DB_USERNAME: eventra_app
          DB_PASSWORD: ci-test-password
        run: php artisan migrate:fresh --seed --force
      - name: Backend tests
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: eventflow_test
          DB_USERNAME: eventra_app
          DB_PASSWORD: ci-test-password
        run: php artisan test
      - name: Dependency audit (backend)
        run: composer audit

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Detect frontend
        id: has
        run: echo "exists=$(test -f frontend/package.json && echo yes || echo no)" >> "$GITHUB_OUTPUT"
        working-directory: .
      - uses: actions/setup-node@v4
        if: steps.has.outputs.exists == 'yes'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        if: steps.has.outputs.exists == 'yes'
        run: npm ci || npm install
      - name: Lint
        if: steps.has.outputs.exists == 'yes'
        run: npm run lint --if-present
      - name: Unit tests
        if: steps.has.outputs.exists == 'yes'
        run: npm run test --if-present
      - name: Build
        if: steps.has.outputs.exists == 'yes'
        run: npm run build
      - name: Dependency audit (frontend)
        if: steps.has.outputs.exists == 'yes'
        run: npm audit --audit-level=high

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
